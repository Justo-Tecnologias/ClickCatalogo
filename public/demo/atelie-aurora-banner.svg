  <text x="126" y="335" fill="#dca58f" font-family="Arial, sans-serif" font-size="38" letter-spacing="3">PRESENTES FEITOS COM AFETO</text>
  <text x="126" y="420" fill="#ffffff" font-family="Arial, sans-serif" font-size="34" opacity=".76">Velas, kits e detalhes para guardar na memória.</text>
