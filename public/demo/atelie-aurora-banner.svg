  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d0d0f"/><stop offset="1" stop-color="#292124"/></linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff4e8"/><stop offset="1" stop-color="#dca58f"/></linearGradient>
  </defs>
  <rect width="1600" height="600" fill="url(#bg)"/>
  <circle cx="1310" cy="250" r="305" fill="#dca58f" opacity=".1"/>
  <circle cx="1310" cy="250" r="205" fill="#dca58f" opacity=".08"/>
